services:
  - type: web
    name: redline-auto-portal
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: REDLINE_HOST
        value: 0.0.0.0
      - key: REDLINE_DATA_DIR
        value: /tmp/redline-data
      - key: REDLINE_POLL_SECONDS
        value: "600"
      - key: REDLINE_ADMIN_TOKEN
        generateValue: true
